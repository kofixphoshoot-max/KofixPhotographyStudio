[build]
  publish = "site"
  command = "cd site && node tools/scan-media.js"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
[[redirects]]
  from = "/api/portfolio"
  to = "/.netlify/functions/portfolio"
  status = 200
[[redirects]]
  from = "/api/edit"
  to = "/.netlify/functions/edit"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
